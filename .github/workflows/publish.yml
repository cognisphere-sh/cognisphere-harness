# Publish @cognisphere-sh/cognisphere-harness to npmjs.org.
#
# Triggered when a GitHub Release is published (tag the release with the version
# you bumped in packages/harness/package.json), or manually.
#
# Auth is npm trusted publishing (OIDC): the package's npmjs.com settings trust
# this repo + this workflow file, so no token is stored. Renaming this file
# breaks publishing until the trusted publisher is updated on npmjs.com.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing
  packages: write # runtime image on GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # `pnpm pack` runs the package's prepack (builds the web UI into dist-web/,
      # bundles CHANGELOG.md); `npm publish` does the OIDC exchange and adds
      # provenance.
      - working-directory: packages/harness
        run: pnpm pack && npm publish ./*.tgz --access public
