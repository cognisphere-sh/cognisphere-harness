<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact title</title>
<style>
  /* Self-contained on purpose: no external stylesheet or font can be uploaded
     alongside this file. System fonts, light + dark, one fluid column that
     works from a 360px phone to a wide desktop. Sizes are in rem — no fixed
     pixel widths anywhere. */
  :root { color-scheme: light dark; --fg: #16181d; --muted: #5c6370; --line: #e3e6ea; --bg: #fff; --accent: #1f7a4d; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8eaed; --muted: #9aa3af; --line: #2b2f36; --bg: #14161a; --accent: #8ff0b8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 46rem;
         padding: 2rem clamp(1rem, 4vw, 2rem) max(3rem, env(safe-area-inset-bottom));
         background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         overflow-wrap: anywhere; }            /* long URLs must not widen the page */
  h1 { font-size: clamp(1.5rem, 1.2rem + 1.6vw, 2rem); line-height: 1.2; margin: 0 0 .25rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .5rem; }
  .meta { color: var(--muted); font-size: .9rem; margin: 0 0 2rem; }

  /* Columns that collapse on their own — no per-breakpoint media queries. */
  .cols { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
  .card { padding: 1rem; border: 1px solid var(--line); border-radius: .75rem; }
  .card b { display: block; font-size: clamp(1.4rem, 1.1rem + 1.4vw, 1.9rem); color: var(--accent); }

  /* Wrap anything intrinsically wide in this — IT scrolls, the page never does. */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  th, td { text-align: left; padding: .55rem .75rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }

  img { max-width: 100%; height: auto; }       /* absolute https:// URL or data: URI */
  a { color: inherit; }
  a, button { min-height: 2.75rem; }           /* tap targets, not mouse targets */
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
</style>

<h1>Artifact title</h1>
<p class="meta">What this is, in one line. · Prepared 2026-01-01</p>

<div class="cols">
  <div class="card"><b>42</b>Headline number</div>
  <div class="card"><b>7 days</b>Another one</div>
</div>

<h2>Section</h2>
<p>Body text.</p>

<div class="scroll">
  <table>
    <tr><th>Column</th><th>Column</th></tr>
    <tr><td>value</td><td>value</td></tr>
  </table>
</div>

<footer>Source: … · Figures as of … · Generated by <!-- agent name --> for <!-- who asked -->.</footer>
